system: "base24"
name: "Jet Black"
slug: "jet-black"
author: "Rudra"
variant: "dark"
description: "Pure-black theme derived from VS Code Pitch Black + Dark+, equalized in OKLCH for legibility on #000."
palette:
  # ── Achromatic ramp (dark → light) ──
  base00: "000000"  # background — pure black (terminal bg)
  base01: "1a1a1a"  # selection / diff background, faint UI
  base02: "2a2a2a"  # line numbers, borders, line highlight
  base03: "666666"  # comments, invisibles, muted UI
  base04: "808080"  # dark foreground, UI accents (Pitch Black tag-bracket gray)
  base05: "d4d4d4"  # default foreground (Pitch Black primary text)
  base06: "e8e8e8"  # lighter foreground
  base07: "ffffff"  # brightest — emphasis / headings
  # ── Accents (normal ANSI) — vivid neon, high chroma, APCA-checked on #000 ──
  # Punchy by design (Lc mostly >=70). Re-tune lightness: dev/oklch.py tune <hex> <Lc>
  base08: "ff6360"  # red        — variables, errors, deleted
  base09: "ff8c1f"  # neon orange— integers, constants, booleans
  base0A: "ffe14d"  # yellow     — classes, search highlight
  base0B: "aef33f"  # lime green — strings, inserted
  base0C: "25e6df"  # neon cyan  — support, regex, escapes
  base0D: "50b4ff"  # electric blue — functions, methods, headings
  base0E: "c77dff"  # neon purple— keywords, control flow
  base0F: "ff6fbf"  # neon pink  — deprecated, special, embedded tags
  # ── base24 extras: darker backgrounds + 6 bright ANSI accents ──
  # base10/11 are darker bgs (can't beat pure black, so stay #000000);
  # brights are R,Y,G,C,B,M only (no bright orange/brown).
  base10: "000000"  # darker black  (bg)
  base11: "000000"  # darkest black (bg)
  base12: "ff8c84"  # bright red     (ANSI 9)
  base13: "fff04d"  # bright yellow  (ANSI 11)
  base14: "c6ff5e"  # bright lime    (ANSI 10)
  base15: "5cf2ee"  # bright cyan    (ANSI 14)
  base16: "5cb3ff"  # bright blue    (ANSI 12)
  base17: "ff88f8"  # bright neon pink (ANSI 13)
