# Jet Black — Starship prompt (jet-black)
# Scheme author: Rudra
# A full prompt theme: module layout mirrors a Catppuccin-style design, recolored
# via [palettes.jet-black]. Use as STARSHIP_CONFIG, or copy the palette block +
# `palette` line into your own starship.toml (module styles reference the
# catppuccin-compatible color names below).
"$schema" = 'https://starship.rs/config-schema.json'

format = """$python$nodejs$rust$golang$java$c$php$kotlin$haskell$docker_context$conda$character"""
right_format = """$time"""
add_newline = false
command_timeout = 2000
palette = 'jet-black'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[nodejs]
symbol = ""
style = "fg:green"
format = '[$symbol $version ]($style)'

[c]
symbol = " "
style = "fg:blue"
format = '[$symbol $version ]($style)'

[rust]
symbol = ""
style = "fg:peach"
format = '[$symbol $version ]($style)'

[golang]
symbol = ""
style = "fg:sapphire"
format = '[$symbol $version ]($style)'

[php]
symbol = ""
style = "fg:lavender"
format = '[$symbol $version ]($style)'

[java]
symbol = " "
style = "fg:red"
format = '[$symbol $version ]($style)'

[kotlin]
symbol = ""
style = "fg:mauve"
format = '[$symbol $version ]($style)'

[haskell]
symbol = ""
style = "fg:pink"
format = '[$symbol $version ]($style)'

[python]
symbol = ""
style = "fg:yellow"
format = '[$symbol $version(\(#$virtualenv\)) ]($style)'

[docker_context]
symbol = ""
style = "fg:blue"
format = '[$symbol $context ]($style)'

[conda]
symbol = "  "
style = "fg:crust bg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "fg:subtext1"
format = '[ $time]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '◯ [⏵](bold fg:green)'
error_symbol = '◯ [⏵](bold fg:red)'
vimcmd_symbol = '◯ [⏴](bold fg:green)'
vimcmd_replace_one_symbol = '◯ [⏴](bold fg:lavender)'
vimcmd_replace_symbol = '◯ [⏴](bold fg:lavender)'
vimcmd_visual_symbol = '◯ [⏴](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:lavender"
disabled = false

# Catppuccin-compatible names mapped to the jet-black base24 palette.
[palettes.jet-black]
rosewater = "#e8e8e8"
flamingo  = "#ff6360"
pink      = "#ff6fbf"
mauve     = "#c77dff"
red       = "#ff6360"
maroon    = "#ff6360"
peach     = "#ff8c1f"
yellow    = "#ffe14d"
green     = "#aef33f"
teal      = "#25e6df"
sky       = "#5cf2ee"
sapphire  = "#50b4ff"
blue      = "#50b4ff"
lavender  = "#c77dff"
text      = "#d4d4d4"
subtext1  = "#808080"
subtext0  = "#808080"
overlay2  = "#666666"
overlay1  = "#666666"
overlay0  = "#666666"
surface2  = "#2a2a2a"
surface1  = "#2a2a2a"
surface0  = "#1a1a1a"
base      = "#000000"
mantle    = "#000000"
crust     = "#000000"
