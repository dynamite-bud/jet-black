# Jet Black — Atuin theme
# Scheme author: Rudra
# Install: copy to ~/.config/atuin/themes/jet-black.toml, then in config.toml:
#   [theme]
#   name = "jet-black"

[theme]
name = "jet-black"

[colors]
Base      = "#d4d4d4"
Title     = "#50b4ff"
Important = "#ff8c1f"
Guidance  = "#808080"
Annotation = "#666666"
AlertInfo  = "#aef33f"
AlertWarn  = "#ffe14d"
AlertError = "#ff6360"
