# vim: ft=ghostty
# Jet Black theme for Ghostty
# Scheme Author: rudra (derived from Pitch Black by Viktor Qvarfordt)
# Scheme System: base24
# Template Author: Tinted Terminal (https://github.com/tinted-theming/tinted-terminal)

